name: Retrieve Firebase Android signing fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Print production and actual Gradle debug certificate SHA-1 fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set +x
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done

          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/vanta-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

          echo "=== Production upload/release certificate SHA-1 ==="
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" |
            grep -E 'SHA1:|SHA-1:'

          echo "=== Building debug variant with Gradle to generate/use its real debug keystore ==="
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

          echo "=== Actual Gradle debug APK certificate SHA-1 ==="
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Gradle debug APK was not found at $APK_PATH"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found in the SDK build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK_PATH" |
            grep -i 'certificate SHA-1 digest'

          echo "Only SHA-1 certificate fingerprints are printed; APKs, keystore files and passwords are not uploaded or displayed."
        working-directory: android
