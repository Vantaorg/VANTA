name: Full Git History Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan all reachable Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@latest
      - name: Scan every reachable commit and deleted file
        env:
          PATH: ${{ env.PATH }}:${{ github.workspace }}/../go/bin
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gitleaks git . --redact --no-banner --exit-code 1 --log-opts="--all"
