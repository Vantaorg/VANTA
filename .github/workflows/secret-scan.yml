name: Full Git History Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan all reachable Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      - name: Scan every reachable commit and deleted file
        id: scan
        continue-on-error: true
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gitleaks git . --redact --no-banner --exit-code 1 --log-opts="--all" --report-format json --report-path gitleaks-report.json
      - name: Print redacted finding metadata only
        if: always()
        run: |
          if [ -s gitleaks-report.json ]; then
            jq -r '.[] | [.RuleID, .File, (.StartLine | tostring), .Commit, .Description] | @tsv' gitleaks-report.json
          else
            echo "No findings."
          fi
      - name: Fail when secrets are detected
        if: steps.scan.outcome == 'failure'
        run: exit 1

  dependency-audit:
    name: Audit frontend and backend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate temporary backend lockfile for audit
        run: npm --prefix backend install --package-lock-only --ignore-scripts
      - name: Audit backend dependencies
        run: npm audit --prefix backend --audit-level=high
      - name: Generate temporary frontend lockfile for audit
        run: npm --prefix frontend install --package-lock-only --ignore-scripts
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
