name: Regenerate npm workspace lockfile

on:
  push:
    branches: [fix/frontend-lockfile-security]
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-lockfile-security
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate root workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --workspaces --include-workspace-root
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Root lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize root npm workspace lockfile"
          git push
