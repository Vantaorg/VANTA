name: Diagnose minimatch dependency chain

on:
  push:
    branches:
      - security/force-minimatch-upgrade
    paths:
      - ".github/workflows/force-minimatch-upgrade.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/force-minimatch-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Show dependency ownership and resolved versions
        run: |
          npm ls @typescript-eslint/parser @typescript-eslint/eslint-plugin @typescript-eslint/typescript-estree minimatch --all || true
          npm explain minimatch || true
      - name: Check published patched releases and dependency ranges
        run: |
          npm view @typescript-eslint/parser version
          npm view @typescript-eslint/eslint-plugin version
          npm view @typescript-eslint/typescript-estree version
          npm view @typescript-eslint/typescript-estree@latest dependencies.minimatch
          npm view minimatch version
          npm view minimatch@11.0.1 engines
